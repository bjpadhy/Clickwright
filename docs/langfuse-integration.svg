<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="Inter,system-ui,sans-serif">
  <defs>
    <filter id="ds" x="-2%" y="-3%" width="104%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.07"/></filter>
    <marker id="ma" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="7" markerHeight="5" orient="auto"><path d="M0 .5L9 3.5 0 6.5z" fill="#64748b"/></marker>
    <marker id="mo" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="7" markerHeight="5" orient="auto"><path d="M0 .5L9 3.5 0 6.5z" fill="#ea580c"/></marker>
  </defs>

  <rect width="1100" height="580" rx="8" fill="#fafbfc"/>
  <text x="550" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" letter-spacing="-0.3">Langfuse Integration — Every Pipeline Step is a Traced Span</text>
  <text x="550" y="50" text-anchor="middle" font-size="11" fill="#94a3b8">Not a bolt-on — Langfuse is wired into the core step() function that every agent operation passes through</text>

  <!-- ═══ LEFT: Pipeline steps ═══ -->
  <rect x="20" y="70" width="480" height="490" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#ds)"/>
  <text x="260" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Pipeline Execution</text>
  <text x="260" y="112" text-anchor="middle" font-size="9" fill="#94a3b8">Every box below is a Langfuse span — created by step() in core/tracing.ts</text>

  <!-- Trace -->
  <rect x="40" y="126" width="440" height="28" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="260" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">Trace: pipeline:01_express_checkout</text>

  <!-- Instrumentation span -->
  <rect x="52" y="164" width="416" height="150" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="68" y="182" font-size="10" font-weight="700" fill="#0d9488">span: instrumentation</text>

  <!-- Nested spans -->
  <rect x="68" y="192" width="130" height="24" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="133" y="208" text-anchor="middle" font-size="8.5" fill="#334155">span: profile</text>

  <rect x="206" y="192" width="130" height="24" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="271" y="208" text-anchor="middle" font-size="8.5" fill="#334155">span: context_load</text>

  <rect x="344" y="192" width="116" height="24" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="402" y="208" text-anchor="middle" font-size="8.5" fill="#334155">span: reconcile</text>

  <rect x="68" y="222" width="200" height="28" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="168" y="240" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1e40af">span: schema_design_attempt_1</text>
  <rect x="80" y="232" width="60" height="14" rx="3" fill="#dbeafe"/>
  <text x="110" y="242" text-anchor="middle" font-size="7" fill="#1e40af">generation ✦</text>

  <rect x="68" y="256" width="130" height="24" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="133" y="272" text-anchor="middle" font-size="8.5" fill="#334155">span: dry_run</text>

  <rect x="206" y="256" width="130" height="24" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="271" y="272" text-anchor="middle" font-size="8.5" fill="#991b1b">span: approval</text>

  <rect x="344" y="256" width="116" height="24" rx="5" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="402" y="272" text-anchor="middle" font-size="8.5" fill="#334155">span: execution</text>

  <rect x="68" y="286" width="200" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="168" y="300" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">score: self_heal_attempts=1, rows_verified=1</text>

  <!-- Context update span -->
  <rect x="52" y="320" width="416" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="68" y="338" font-size="10" font-weight="700" fill="#475569">span: context_update</text>

  <rect x="68" y="348" width="180" height="24" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="158" y="364" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1e40af">gen: context_write_feature ✦</text>

  <rect x="256" y="348" width="200" height="24" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="356" y="364" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1e40af">gen: context_write_conventions ✦</text>

  <rect x="68" y="378" width="388" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="262" y="392" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">score: context_entries_written=8, context_update_attempts=1</text>

  <!-- Chat trace -->
  <rect x="40" y="420" width="440" height="120" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="260" y="440" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">Trace: chat:What's our funnel conversion?</text>

  <rect x="56" y="452" width="100" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="106" y="467" text-anchor="middle" font-size="8" fill="#1e40af">gen: plan ✦</text>

  <rect x="164" y="452" width="100" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="214" y="467" text-anchor="middle" font-size="8" fill="#1e40af">gen: sql_t1 ✦</text>

  <rect x="272" y="452" width="100" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="322" y="467" text-anchor="middle" font-size="8" fill="#1e40af">gen: narrate ✦</text>

  <rect x="380" y="452" width="88" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="424" y="467" text-anchor="middle" font-size="8" fill="#1e40af">gen: verify ✦</text>

  <rect x="56" y="480" width="200" height="18" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="156" y="493" text-anchor="middle" font-size="7.5" fill="#334155">span: result_t1 (SQL + rows recorded)</text>

  <rect x="264" y="480" width="200" height="18" rx="4" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="364" y="493" text-anchor="middle" font-size="7.5" fill="#334155">span: verification_result (SQL + rows)</text>

  <rect x="56" y="506" width="408" height="20" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="260" y="520" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">scores: tasks=2, sql_attempts=2, sanity_flags=0, citation_failures=0, cache_hit=0</text>

  <!-- ═══ RIGHT: Langfuse ═══ -->
  <rect x="540" y="70" width="540" height="490" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5" filter="url(#ds)"/>
  <text x="810" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">Langfuse Cloud</text>
  <text x="810" y="112" text-anchor="middle" font-size="9" fill="#ea580c">What gets recorded and why it matters</text>

  <!-- What is captured -->
  <rect x="560" y="128" width="250" height="200" rx="10" fill="#fff" stroke="#fed7aa" stroke-width="1" filter="url(#ds)"/>
  <text x="685" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Captured Per Span</text>

  <text x="576" y="172" font-size="10" fill="#334155">✦ <tspan font-weight="600">LLM generations</tspan></text>
  <text x="588" y="186" font-size="8.5" fill="#64748b">prompt · completion · model · tokens · cost</text>

  <text x="576" y="206" font-size="10" fill="#334155">◆ <tspan font-weight="600">SQL executions</tspan></text>
  <text x="588" y="220" font-size="8.5" fill="#64748b">query text · row count · result sample (≤50)</text>

  <text x="576" y="240" font-size="10" fill="#334155">⛔ <tspan font-weight="600">Approval decisions</tspan></text>
  <text x="588" y="254" font-size="8.5" fill="#64748b">approved/rejected · feedback · identity</text>

  <text x="576" y="274" font-size="10" fill="#334155">⚠ <tspan font-weight="600">Failed attempts</tspan></text>
  <text x="588" y="288" font-size="8.5" fill="#64748b">error message · kept as evidence of self-healing</text>

  <text x="576" y="308" font-size="10" fill="#334155">⏱ <tspan font-weight="600">Timing</tspan></text>
  <text x="588" y="322" font-size="8.5" fill="#64748b">per-span elapsed · start/end timestamps</text>

  <!-- Scores -->
  <rect x="820" y="128" width="250" height="200" rx="10" fill="#fff" stroke="#fed7aa" stroke-width="1" filter="url(#ds)"/>
  <text x="945" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Numeric Scores</text>
  <text x="945" y="166" text-anchor="middle" font-size="8" fill="#94a3b8">sortable columns in the trace list</text>

  <text x="836" y="188" font-size="9.5" fill="#334155"><tspan font-weight="600">self_heal_attempts</tspan> — retries before success</text>
  <text x="836" y="208" font-size="9.5" fill="#334155"><tspan font-weight="600">rows_verified</tspan> — row counts matched</text>
  <text x="836" y="228" font-size="9.5" fill="#334155"><tspan font-weight="600">context_entries_written</tspan> — docs added</text>
  <text x="836" y="248" font-size="9.5" fill="#334155"><tspan font-weight="600">sanity_flags</tspan> — flagged results</text>
  <text x="836" y="268" font-size="9.5" fill="#334155"><tspan font-weight="600">citation_failures</tspan> — uncited number retries</text>
  <text x="836" y="288" font-size="9.5" fill="#334155"><tspan font-weight="600">cache_hit</tspan> — served from cache</text>
  <text x="836" y="308" font-size="9.5" fill="#334155"><tspan font-weight="600">digests_computed</tspan> — full-set profiles ran</text>
  <text x="836" y="322" font-size="9.5" fill="#334155"><tspan font-weight="600">rows_analyzed_total</tspan> — data coverage</text>

  <!-- How it's wired -->
  <rect x="560" y="345" width="510" height="100" rx="10" fill="#fff" stroke="#fed7aa" stroke-width="1" filter="url(#ds)"/>
  <text x="815" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">How It's Wired (core/tracing.ts)</text>

  <text x="576" y="390" font-size="10" fill="#334155"><tspan font-weight="600" fill="#c2410c">step(parent, name, input, fn)</tspan> — wraps every agent operation</text>
  <text x="588" y="406" font-size="9" fill="#64748b">Creates a Langfuse span on entry · records output or error on exit · emits SSE events for the UI</text>

  <text x="576" y="426" font-size="10" fill="#334155"><tspan font-weight="600" fill="#c2410c">recordQuery(parent, name, sql, rows)</tspan> — every SQL execution</text>
  <text x="588" y="440" font-size="9" fill="#64748b">Records the query text and result sample as a child span — the audit trail for every number</text>

  <!-- Why it matters -->
  <rect x="560" y="460" width="510" height="86" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="815" y="482" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Why This Matters</text>
  <text x="576" y="502" font-size="10" fill="#7f1d1d">Every number in an insight traces backward through: narration span → SQL span → query text →</text>
  <text x="576" y="518" font-size="10" fill="#7f1d1d">ClickHouse result → verified by an independent query. A wrong number is findable in 30 seconds.</text>
  <text x="576" y="534" font-size="10" fill="#7f1d1d">Failed attempts are evidence, not noise — they prove the self-healing loop is real.</text>

  <!-- Arrows from pipeline to Langfuse -->
  <line x1="500" y1="200" x2="538" y2="200" stroke="#fb923c" stroke-width="2" marker-end="url(#mo)"/>
  <line x1="500" y1="360" x2="538" y2="360" stroke="#fb923c" stroke-width="2" marker-end="url(#mo)"/>
  <line x1="500" y1="470" x2="538" y2="470" stroke="#fb923c" stroke-width="2" marker-end="url(#mo)"/>

  <text x="519" y="194" text-anchor="middle" font-size="7" fill="#fb923c" transform="rotate(-90 519 194)">spans</text>
  <text x="519" y="354" text-anchor="middle" font-size="7" fill="#fb923c" transform="rotate(-90 519 354)">spans</text>
  <text x="519" y="464" text-anchor="middle" font-size="7" fill="#fb923c" transform="rotate(-90 519 464)">spans</text>
</svg>
