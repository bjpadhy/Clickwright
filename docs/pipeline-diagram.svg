<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 920" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8494A7"/>
    </marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B97A1F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="990" height="920" fill="#FAFBFD"/>

  <!-- ══════════ INPUT ══════════ -->
  <rect x="20" y="20" width="840" height="58" rx="8" fill="#FDF3E3" stroke="#B97A1F" stroke-width="1.5"/>
  <text x="440" y="43" text-anchor="middle" font-size="14" font-weight="700" fill="#16202C">INPUT — one feature spec</text>
  <text x="440" y="63" text-anchor="middle" font-size="11.5" fill="#4A5A6D">spec.md (prose: the feature, its events, the PM&#8217;s questions)  +  events.ndjson (raw sample events)</text>

  <line x1="440" y1="78" x2="440" y2="116" stroke="#8494A7" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="452" y="102" font-size="10.5" font-style="italic" fill="#8494A7">getContext() — conventions, envelope fields, join strategy</text>

  <!-- ══════════ ① INSTRUMENTATION ══════════ -->
  <rect x="20" y="120" width="840" height="210" rx="8" fill="#FFFFFF" stroke="#1F6FD6" stroke-width="2"/>
  <rect x="20" y="120" width="840" height="30" rx="8" fill="#E8F1FC" stroke="#1F6FD6" stroke-width="2"/>
  <text x="34" y="140" font-size="13.5" font-weight="700" fill="#16202C">①  INSTRUMENTATION AGENT</text>
  <text x="846" y="140" text-anchor="end" font-size="11" font-style="italic" fill="#8494A7">the data engineer</text>

  <rect x="30" y="168" width="250" height="56" rx="5" fill="#F1F5F9" stroke="#C9D3DF" stroke-width="1.2"/>
  <text x="155" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#16202C">PROFILER  (pure code)</text>
  <text x="155" y="208" text-anchor="middle" font-size="10.5" fill="#4A5A6D">per field: type · null rate · cardinality</text>

  <rect x="315" y="168" width="250" height="56" rx="5" fill="#E8F1FC" stroke="#1F6FD6" stroke-width="1.2"/>
  <text x="440" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#16202C">LLM WRITES DDL</text>
  <text x="440" y="208" text-anchor="middle" font-size="10.5" fill="#4A5A6D">ordering keys · partitions · LowCardinality</text>

  <rect x="600" y="168" width="250" height="56" rx="5" fill="#E6F5EC" stroke="#1E7D4F" stroke-width="1.2"/>
  <text x="725" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#16202C">CLICKHOUSE EXECUTES</text>
  <text x="725" y="208" text-anchor="middle" font-size="10.5" fill="#4A5A6D">the DDL runs — or errors</text>

  <line x1="280" y1="196" x2="313" y2="196" stroke="#8494A7" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="565" y1="196" x2="598" y2="196" stroke="#8494A7" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- retry loop -->
  <path d="M 725 224 L 725 252 L 440 252 L 440 228" fill="none" stroke="#B97A1F" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ah-amber)"/>
  <text x="440" y="270" text-anchor="middle" font-size="10.5" font-style="italic" fill="#B97A1F">on error: the real ClickHouse error is fed back, DDL regenerated (&#8804;3×) — the self-healing loop</text>

  <text x="440" y="308" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E7D4F">on success:  create materialized views  ·  load events.ndjson  ·  verify row counts match the file</text>

  <line x1="440" y1="330" x2="440" y2="368" stroke="#8494A7" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="452" y="354" font-size="10.5" font-style="italic" fill="#8494A7">&#8220;created tables X, Y with columns &#8230;&#8221;</text>

  <!-- ══════════ ② CONTEXT ══════════ -->
  <rect x="20" y="372" width="840" height="84" rx="8" fill="#FFFFFF" stroke="#1F6FD6" stroke-width="2"/>
  <rect x="20" y="372" width="840" height="30" rx="8" fill="#E8F1FC" stroke="#1F6FD6" stroke-width="2"/>
  <text x="34" y="392" font-size="13.5" font-weight="700" fill="#16202C">②  CONTEXT AGENT  (write)</text>
  <text x="846" y="392" text-anchor="end" font-size="11" font-style="italic" fill="#8494A7">the documentation keeper</text>
  <text x="440" y="424" text-anchor="middle" font-size="11.5" fill="#4A5A6D">LLM reads spec + new schema  &#8594;  proposes entries (new metrics, funnel links)  &#8594;  context_store as version n+1</text>
  <text x="440" y="444" text-anchor="middle" font-size="10.5" font-style="italic" fill="#8494A7">append-only: old versions kept — freshness is provable in the trace, not claimed</text>

  <line x1="440" y1="456" x2="440" y2="494" stroke="#8494A7" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="452" y="480" font-size="10.5" font-style="italic" fill="#8494A7">fresh context, version n+1</text>

  <!-- ══════════ ③ ANALYTICS ══════════ -->
  <rect x="20" y="498" width="840" height="268" rx="8" fill="#FFFFFF" stroke="#1F6FD6" stroke-width="2"/>
  <rect x="20" y="498" width="840" height="30" rx="8" fill="#E8F1FC" stroke="#1F6FD6" stroke-width="2"/>
  <text x="34" y="518" font-size="13.5" font-weight="700" fill="#16202C">③  ANALYTICS AGENT</text>
  <text x="846" y="518" text-anchor="end" font-size="11" font-style="italic" fill="#8494A7">the analyst</text>

  <rect x="30" y="546" width="250" height="56" rx="5" fill="#E8F1FC" stroke="#1F6FD6" stroke-width="1.2"/>
  <text x="155" y="568" text-anchor="middle" font-size="12" font-weight="700" fill="#16202C">PLAN  (LLM)</text>
  <text x="155" y="586" text-anchor="middle" font-size="10.5" fill="#4A5A6D">tasks: tables, metric definitions, dimensions</text>

  <rect x="315" y="546" width="250" height="56" rx="5" fill="#E8F1FC" stroke="#1F6FD6" stroke-width="1.2"/>
  <text x="440" y="568" text-anchor="middle" font-size="12" font-weight="700" fill="#16202C">LLM WRITES SQL</text>
  <text x="440" y="586" text-anchor="middle" font-size="10.5" fill="#4A5A6D">per task · retry on error &#8804;3×</text>

  <rect x="600" y="546" width="250" height="56" rx="5" fill="#E6F5EC" stroke="#1E7D4F" stroke-width="1.2"/>
  <text x="725" y="568" text-anchor="middle" font-size="12" font-weight="700" fill="#16202C">CLICKHOUSE COMPUTES</text>
  <text x="725" y="586" text-anchor="middle" font-size="10.5" fill="#4A5A6D">real rows come back — never the model</text>

  <line x1="280" y1="574" x2="313" y2="574" stroke="#8494A7" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="565" y1="574" x2="598" y2="574" stroke="#8494A7" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- connector row1 -> row2 -->
  <path d="M 725 602 L 725 620 L 155 620 L 155 636" fill="none" stroke="#8494A7" stroke-width="1.4" marker-end="url(#ah)"/>

  <rect x="30" y="640" width="250" height="56" rx="5" fill="#F1F5F9" stroke="#C9D3DF" stroke-width="1.2"/>
  <text x="155" y="662" text-anchor="middle" font-size="12" font-weight="700" fill="#16202C">SANITY GATE  (code)</text>
  <text x="155" y="680" text-anchor="middle" font-size="10.5" fill="#4A5A6D">drop n&lt;50 · rates &gt;100% · empty sets</text>

  <rect x="315" y="640" width="250" height="56" rx="5" fill="#E8F1FC" stroke="#1F6FD6" stroke-width="1.2"/>
  <text x="440" y="662" text-anchor="middle" font-size="12" font-weight="700" fill="#16202C">NARRATE  (LLM)</text>
  <text x="440" y="680" text-anchor="middle" font-size="10.5" fill="#4A5A6D">every number must exist in the results</text>

  <rect x="600" y="640" width="250" height="56" rx="5" fill="#F1F5F9" stroke="#C9D3DF" stroke-width="1.2"/>
  <text x="725" y="662" text-anchor="middle" font-size="12" font-weight="700" fill="#16202C">QUALITY GATE  (LLM)</text>
  <text x="725" y="680" text-anchor="middle" font-size="10.5" fill="#4A5A6D">actionable? cites numbers? names a segment?</text>

  <line x1="280" y1="668" x2="313" y2="668" stroke="#8494A7" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="565" y1="668" x2="598" y2="668" stroke="#8494A7" stroke-width="1.4" marker-end="url(#ah)"/>

  <text x="440" y="736" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1F6FD6">mid-analysis lookup:  getContext(&#8220;iOS OTP failures?&#8221;)  &#8594;  returns known issue K1  —  this turns &#8220;what&#8221; into &#8220;why&#8221;</text>

  <line x1="440" y1="766" x2="440" y2="800" stroke="#8494A7" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ══════════ OUTPUT ══════════ -->
  <rect x="20" y="804" width="840" height="76" rx="8" fill="#E6F5EC" stroke="#1E7D4F" stroke-width="1.5"/>
  <text x="440" y="828" text-anchor="middle" font-size="14" font-weight="700" fill="#16202C">OUTPUT</text>
  <text x="440" y="848" text-anchor="middle" font-size="11.5" fill="#4A5A6D">live optimized tables + materialized views   ·   updated versioned context</text>
  <text x="440" y="866" text-anchor="middle" font-size="11.5" fill="#4A5A6D">insight report:  claim · computed numbers · segment · WHY (linked to known issues) · recommended action</text>

  <!-- ══════════ LANGFUSE RAIL ══════════ -->
  <rect x="880" y="20" width="90" height="860" rx="8" fill="#E8F1FC" stroke="#1F6FD6" stroke-width="1.5"/>
  <text x="931" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#16202C" transform="rotate(90 931 450)">LANGFUSE — ONE NESTED TRACE WRAPS THE WHOLE RUN</text>
  <text x="949" y="450" text-anchor="middle" font-size="10.5" font-style="italic" fill="#4A5A6D" transform="rotate(90 949 450)">every prompt · every retry (failures included) · every SQL + its result rows</text>
</svg>
