# The webapp container serves the built SPA and is the single origin the browser
# talks to. Every `/api/*` call is proxied to the backend service, which is what
# the Vite dev proxy does locally — so the frontend keeps calling relative paths
# and nothing in the app knows whether it is running in Docker.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A spec upload carries the whole events.ndjson; the backend accepts 50 MB.
    client_max_body_size 60m;

    location /api/ {
        # No trailing slash: the backend's routes are themselves under /api.
        proxy_pass http://backend:8787;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Two endpoints stream Server-Sent Events for minutes at a time —
        # `/api/runs/:id/events` and the chat answer stream. Buffering would hold
        # each step back until the response closed, turning a live agent log into
        # one silent wait, so it is off and the timeouts are long.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Client-side routing: any unknown path is the SPA, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # keeps serving the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
